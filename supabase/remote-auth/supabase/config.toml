# Remote auth settings for HabeshaMatch (email code sign in + one-time phone verification).
# Push only with:   supabase config push --workdir supabase/remote-auth --project-ref <ref>
# Only what is declared here is pushed; everything else on the project stays as it is.
#
# There is deliberately NO [auth.sms.twilio] section. Twilio is switched on and its credentials are
# entered in the Supabase dashboard only, so a push can never overwrite them. (An unset env() would be
# pushed as its literal text.) Test numbers below only work once Twilio is switched on there.
project_id = "habeshamatch"

[auth.email]
otp_length = 6

[auth.email.template.confirmation]
subject = "Your HabeshaMatch code"
content_path = "./templates/sign_in_code.html"

[auth.email.template.magic_link]
subject = "Your HabeshaMatch code"
content_path = "./templates/sign_in_code.html"

[auth.sms]
# Phone is not a sign in method.
enable_signup = false
# DELIBERATELY NOT SET HERE: enable_confirmations.
# "Enable phone confirmations" must be ON, or updateUser({ phone }) saves the number without a code.
# Supabase CLI 2.119 reads and writes this setting inverted for the remote project: it reported "on"
# while the dashboard toggle was off, and pushing "true" switched the toggle OFF (found 2026-10-14,
# phone verified with no code). Control it in the dashboard only: Authentication > Sign In / Providers
# > Phone > Enable phone confirmations. Check it by behaviour (the code screen appears), not by diff.

[auth.sms.test_otp]
14165550199 = "123456"
12025550198 = "123456"
251911000199 = "123456"
